# Ledger de hipótesis publicadas — lo mantiene AG-EDITORIAL-CALIBRADOR.
#
# Una hipótesis publicada es una creencia FALSABLE del autor, expuesta en
# público con su condición de falsación. El calibrador la sigue hasta que la
# realidad la confirma o la falsa, y anota qué tan bien calibrada estaba —
# ése es el núcleo del loop de mejora: el autor aprende cuán buenas son sus
# creencias contra el mundo, no contra su propia opinión.
#
# Schema por entrada:
#   id: HIP-YYYY-NN
#   pieza: archivo.html
#   asercion: la afirmación falsable, en una frase
#   horizonte: cuándo debería verse (fecha o condición temporal)
#   falsador: el hecho observable que la falsaría
#   fecha_publicacion: YYYY-MM-DD
#   estado: viva | confirmada | falsada
#   evidencia: []   # se llena cuando el horizonte llega
#   calibracion: ''  # nota del calibrador post-outcome
#
# Regla dura: una hipótesis sin los tres campos (aserción + horizonte +
# falsador) NO se publica (E02 de eval_editorial, fail-closed). Publicar una
# creencia que la realidad puede tumbar es el estándar; esconder el falsador
# para no quedar mal es lo prohibido.

# ─────────────────────────────────────────────────────────────────────────
# Capa 1 del eval de la pieza sobre el proyecto de ley.
#
# El encargo del CEO fue explícito: "el eval es clave". Los gates antes de
# publicar (capa 0) miden la pieza; estas tres hipótesis miden si el MARCO
# viajó, que es lo único que decide si la página sirvió. Se anotan ANTES de
# publicar: un eval que se escribe después del resultado no es eval.
#
# REESCRITAS el 12-sep-2026, mismo día, tras el reencuadre a la tesis del
# domicilio. Las tres originales medían la página anterior: falsaban contra
# el marco "control por oposición" —frase que hoy aparece cero veces en el
# sitio—, contra cuñas que se reescribieron enteras, y declaraban
# pieza: index.html para el caso sancionado, que se mudó a objeciones.html.
# Medir eso el 12 de octubre habría sido medir una página que no se publicó.
# Los enunciados originales viven en git, en el commit b2f0502.
#
# Se conservan los ids: son las hipótesis DE ESTA PIEZA, y renumerarlas
# rompería la trazabilidad de la calibración. Lo que cambió es contra qué
# se contrastan.
#
# Las mide AG-EDITORIAL-CALIBRADOR en la fecha de corte, no antes y no
# "cuando se vea". Si el horizonte llega y nadie midió, la entrada queda
# viva y eso también es un dato sobre el loop.
# ─────────────────────────────────────────────────────────────────────────

hipotesis:

  - id: HIP-2026-01
    pieza: index.html
    asercion: >-
      Soldar las dos ideas —quien invoca Luxemburgo ya aceptó sus estándares,
      porque lo que atrae la plata es lo mismo que la cuida— es más
      persuasivo para un legislador, un regulador o un dirigente gremial que
      defender la separación de roles por sí sola. Razón: monta sobre una
      ambición país que ya tiene consenso, en vez de pedir que se acepte una
      regla nueva.
    horizonte: 2026-10-12
    falsador: >-
      A 30 días de publicada, cero apariciones públicas de la soldadura o de
      una de las cuñas vigentes —"la plomería se queda en casa", "no hay
      Luxemburgo sin los estándares de Luxemburgo", "tres manos, tres firmas",
      "Chile es la excepción"— en boca de un legislador, regulador o dirigente
      gremial (sesión de comisión, columna, entrevista, declaración).
      Si eso ocurre, el encuadre no sirvió: se reescribe el argumento o se
      abandona la tesis. No se culpa al medio ni al diseño.
    fecha_publicacion: 2026-09-12
    estado: viva
    evidencia: []
    calibracion: ''

  - id: HIP-2026-02
    pieza: index.html
    asercion: >-
      Una pieza que no publica una sola cifra de mercado consigue cobertura
      igual, porque el gancho que le ofrece al periodista es una tesis país
      citable —"Chile puede ser el Luxemburgo de América Latina"— y no un
      dato. Es la apuesta explícita de la página: credibilidad sobre pickup.
    horizonte: 2026-10-12
    falsador: >-
      A 30 días, cero notas de prensa que recojan la tesis o citen una cuña
      de la página. Señal adicional a anotar si aparece: una nota que pida,
      estime o invente cifras de tamaño que la página deliberadamente no da
      —eso indicaría que la ausencia de números fue el costo, y obliga a
      decidir si se registra evidencia citable o se acepta el techo.
    fecha_publicacion: 2026-09-12
    estado: viva
    evidencia: []
    calibracion: ''

  - id: HIP-2026-03
    pieza: objeciones.html
    asercion: >-
      Quien hoy sostiene en público la salida modesta —"seamos un hub andino
      con Perú y Colombia, paso a paso"— puede conceder que esa versión
      necesita la misma regla de separación, porque la concesión no le cuesta
      la ambición: solo la secuencia.
    horizonte: 2026-10-27
    falsador: >-
      A 45 días, nadie que haya sostenido públicamente la versión modesta
      concede que requiere separar quién administra de quién decide; o
      alguien la refuta mostrando un domicilio de fondos relevante que
      funcione sin esa separación. Lo segundo tumbaría la tesis central de
      la página, no solo esta hipótesis.
    fecha_publicacion: 2026-09-12
    estado: viva
    evidencia: []
    calibracion: ''
