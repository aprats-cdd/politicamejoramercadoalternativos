  #  artículo, de mensaje y de página—, no cifras de mercado: se verifican
  #  leyendo el documento citado, no estimando. Por eso el respaldo son las dos
  #  fuentes documentales del propio proyecto y no una doble medición.)
  - texto: >-
      El Mensaje N° 166-374, de 9 de septiembre de 2026, con el que S.E. el
      Presidente de la República inicia el Proyecto de Ley de Reforma al Mercado
      de Capitales y Financiamiento de la Casa Propia ante la Cámara de
      Diputados, tiene 252 páginas. Crea la figura del gestor de inversiones en
      un nuevo artículo 16 de la Ley N° 20.712, modifica sus artículos 1, 13, 15,
      17, 98, 99, 102 y 103, y reemplaza el artículo 169 de la Ley N° 18.045.
      La Comisión para el Mercado Financiero dispone de un plazo de 6 meses
      desde la publicación de la ley para dictar las normas de carácter general
      que hacen entrar en vigor estas modificaciones. Tokens de referencia
      normativa admitidos para esta pieza: 166-374, 374, 252, 16, 169, 20.712,
      18.045, 6, 9, 12, 2026, 221, 99 y 98, y 8 como marcador de nota al pie.
      El Mensaje N° 166-374 se cita en la pieza
      tanto con coma como sin ella. La regla de vigencia (artículo décimo
      cuarto transitorio) está en la p. 221 del Mensaje.
    fuente_1: "Mensaje N° 166-374, 9 de septiembre de 2026 — Fundamentos II.3 letras i y j (pp. 51-55) y Articulado, artículos noveno (N° 1, 4, 5, 6, 7, 24, 25, 26, 27), décimo quinto N° 6 y décimo cuarto transitorio (pp. 174-221)"
    fuente_2: "Minuta del Ministerio de Hacienda sobre el mismo proyecto, sección C, numerales 21 y 22 — documento complementario independiente que sintetiza las mismas dos materias"
    nota: >-
      Transcripción literal verificada contra el memo informativo al Directorio
      "Separación funcional de roles" (v1.0, 9-sep-2026), que cita el Mensaje
      con página. Son referencias a un proyecto EN TRAMITACIÓN: no es ley
      vigente, y toda pieza que las use debe decirlo.

  # ── Concentración de roles en el caso sancionado (agregado 12-sep-2026) ──
  # (Re-descripción en términos de ROLES de lo ya acreditado en los claims del
  #  caso. No agrega hechos ni cifras nuevas: aporta la proposición estructural
  #  que la página necesita y que hasta hoy no existía como claim, por lo que
  #  no se podía afirmar. Propuesto por AG-SITIO-AUDITOR en la corrida del
  #  12-sep-2026 tras bloquear la formulación de "cuatro roles".)
  - texto: >-
      En el caso sancionado por la CMF, una misma administradora reunió la
      decisión de inversión del fondo, su administración y la condición de
      contraparte del crédito: los créditos fueron canalizados a partes
      relacionadas a través de fondos públicos, y el 80% del Fondo Sartor
      Táctico estaba invertido en pagarés emitidos por personas vinculadas a
      la administradora. La concentración de esos roles en un mismo perímetro
      está acreditada en la resolución sancionatoria; no es una inferencia
      sobre el tamaño de la entidad.
    fuente_1: "CMF, Resolución Exenta N° 10.950, Procedimiento Sancionatorio Sartor AGF S.A., 2024, considerandos (fn5/fn10)"
    fuente_2: "Auditorías independientes PwC Chile y Deloitte Chile encargadas por la CMF sobre fondos administrados por Sartor AGF, 2024 (fn7)"
    nota: >-
      Cubre TRES roles: decide, administra, es contraparte. NO cubre la función
      de valorización. Ninguna pieza puede escribir "valorizaba" ni "cuatro
      roles" apoyándose en este claim: el registro no contiene ningún claim que
      atribuya la valorización a la propia administradora. Para habilitarlo hay
      que leer los considerandos de la Resolución N° 10.950 y confirmarlo;
      hasta entonces, fail-closed en tres roles.
      Tampoco habilita afirmar que la separación de roles habría impedido el
      caso: ese contrafactual es inverificable y el propio corpus del sitio ya
      se desdijo de él. Lo máximo sostenible es detección más temprana y mayor
      costo de ejecución, y eso es argumento del autor, no claim.

  # ── Referencias comparadas: Luxemburgo (UE) y Brasil ──
  # (agregado 12-sep-2026 para el reencuadre de la raíz en torno a la tesis
  #  "Chile puede ser el Luxemburgo de América Latina". Igual que la entrada
  #  anterior, los tokens son REFERENCIAS NORMATIVAS —números de directiva,
  #  de artículo, de instrucción y de resolución—, no cifras de mercado.
  #
  #  ADVERTENCIA DE CALIDAD, declarada y no resuelta: a diferencia del resto
  #  del registro, este claim NO está verificado contra el texto primario. El
  #  proxy de egress de la sesión bloqueó eur-lex.europa.eu, cmfchile.cl,
  #  bcn.cl y los sitios de ALFI, Chambers y CVM; lo que hay es literatura de
  #  práctica leída por búsqueda. Por eso la pieza lo declara al pie Y en el
  #  Método, y por eso NO se publica ninguna cifra de estas jurisdicciones:
  #  ni activos bajo administración, ni número de gestores, ni rankings con
  #  número. La afirmación "segundo domicilio de fondos del mundo" es
  #  cualitativa y va atribuida a fuente secundaria en la propia nota.
  #  Para subir de categoría hay que leer los textos primarios.)
  - texto: >-
      Régimen europeo: la Directiva 2011/61/UE (AIFMD), en su artículo 20,
      permite al gestor autorizado delegar en un tercero la gestión de cartera
      bajo condiciones, sin que la delegación altere su propia responsabilidad
      frente al fondo y sus partícipes, y sin que pueda vaciarse hasta quedar
      como entidad buzón. En el régimen luxemburgués, los prestadores
      esenciales de un fondo regulado —administración central, depositario y
      auditor— deben estar establecidos y autorizados en Luxemburgo o actuar
      por sucursal, mientras la gestión de cartera sí puede delegarse fuera.
      Brasil: la distinción formal entre administrador fiduciário y gestor de
      recursos como actividades registradas por separado proviene de la
      Instrução CVM N° 558 de 2015; la Resolução CVM N° 175 de 2022 consolidó
      el marco de fondos y equiparó al gestor con el administrador como
      prestador de servicio esencial. Tokens de referencia normativa admitidos
      para esta pieza: 2011, 61, 20, 558, 2015, 175, 2022, y 9 y 10 como
      marcadores de nota al pie.
    fuente_1: "Directiva 2011/61/UE del Parlamento Europeo y del Consejo (AIFMD), artículo 20 — consultada por búsqueda, NO verificada contra el texto consolidado en EUR-Lex (dominio bloqueado en la sesión)"
    fuente_2: "Literatura de práctica: Chambers Global Practice Guides, Investment Funds / Alternative Funds — Luxembourg; ALFI y Luxembourg for Finance (régimen luxemburgués). Para Brasil: ANBIMA y literatura de práctica brasileña sobre Instrução CVM 558/2015 y Resolução CVM 175/2022 — NO verificadas contra el texto consolidado de la CVM"
    nota: >-
      Este claim habilita SOLO afirmaciones de arquitectura: qué función puede
      delegarse y cuál debe quedar en el domicilio. NO habilita ninguna cifra
      de tamaño, participación de mercado, empleo ni recaudación de esas
      jurisdicciones, ni comparar regímenes en detalle, ni afirmar que el
      proyecto chileno replique el europeo: la asignación de responsabilidad
      difiere —AIFMD conserva la del gestor autorizado, el proyecto la radica
      en el gestor de inversiones— y escribir lo contrario sería un error
      verificable. Tampoco habilita decir que Chile sería el primero de la
      región: Brasil tiene la separación desde 2015, y la pieza lo dice.

  # ── Registro histórico del desacoplamiento chileno (historia.html) ──
  # Agregado 12-sep-2026. PRIMER CLAIM DEL REGISTRO EN EL TERCER ESTADO
  # `de_oido`, canonizado el mismo día por orden del CEO ("cita de oído y sé
  # explícito en la fuente"). Aquí no hay doble fuente porque no hay fuente
  # abierta: el proxy de egress de la sesión bloqueó bcn.cl, leychile.cl,
  # cmfchile.cl, camara.cl, oas.org y todos los repositorios donde viven
  # estos textos. Lo que hay es transcripción devuelta por el buscador, que
  # corre del otro lado del proxy.
  #
  # Los tokens de este claim son REFERENCIAS NORMATIVAS —números de ley, de
  # artículo y años— y marcadores de nota al pie. NINGUNA cifra de mercado,
  # de tamaño ni de participación entra por acá: esa línea no se movió con el
  # cambio de doctrina (voz-de-la-casa.md, regla 8: una cifra citada de oído
  # no se publica como dato).
  - texto: >-
      Referencias normativas del registro histórico: Ley de Mercado de Valores
      de 1981 (intermediación de valores como industria separada, con registros
      propios); Ley General de Bancos, giro exclusivo con lista taxativa y
      filiales intermediarias de valores; Ley 18.876 de 1989 (entidades
      privadas de depósito y custodia de valores, objeto exclusivo); artículo
      179 de la Ley 18.045, incorporado por la Ley 19.301 de 1994 (registro
      especial, anotación separada con individualización del dueño, depósito
      obligatorio en empresa regulada por la Ley 18.876, cuenta individual a
      solicitud); Ley 20.345 de 2009 (entidad de contraparte central, principio
      de firmeza); artículo 53 de la Ley 20.712 de 2014 (depósito de los
      instrumentos susceptibles de ser custodiados; el regulador define por
      norma cuáles no lo son); un fraude de 2003, usado solo para la corrección
      cronológica y sin nombrar. Propuesta del gremio de administradoras de fondos
      de inversión de marzo de 2026 sobre separación de roles.
      Tokens de referencia admitidos para esta pieza, con sus variantes de
      puntuación tal como aparecen en el cuerpo:
      1 2 3 4 5 6 7 8 8. 53 179 18.876 19.301 20.345 20.712 18.045
      1981 1981, 1981. 1989 1989, 1989. 1994 1994, 2003. 2009 2014 2014. 2026 2026,
      La referencia al Mensaje presidencial N° 166-374 que esta pieza hace en su
      Método NO entra por acá: entra por el claim del proyecto de ley, que tiene
      doble fuente y es el único documento primario que el autor leyó. Esa
      separación es el hallazgo B6/B9 del adversario y es deliberada — mezclar
      una fuente leída dentro de un claim de oído es exactamente la confusión
      que la regla 8 existe para impedir.
    de_oido: true
    fuente_citada: >-
      Ley 18.876 (D.O. 21-dic-1989), ficha en repositorio jurídico comercial y
      páginas normativas de la Superintendencia de Pensiones · artículo 179 de
      la Ley 18.045 y Boletín N° 1.170-05 (Ley 19.301), fichas en camara.cl y
      cmfchile.cl · Ley 20.345 (2009), descripciones secundarias del régimen de
      compensación y liquidación · artículo 53 de la Ley 20.712, transcripción
      devuelta por búsqueda y políticas de custodia publicadas por
      administradoras chilenas · régimen de filiales bancarias de la Ley General
      de Bancos (DFL 3 de 1997) y circular de la superintendencia bancaria de
      diciembre de 1997 con la frase "absolutamente independientes" ·
      Diario Financiero, "Administrador de fondos y gestor de inversiones: la
      separación de roles que proponen las AGF para la industria", 30-mar-2026.
    via: >-
      Buscador web (corre fuera del proxy de egress y devuelve resúmenes con
      cita). NINGÚN documento primario fue abierto por el autor ni por el
      agente: bcn.cl, leychile.cl, cmfchile.cl, camara.cl, oas.org, scielo.cl y
      df.cl devolvieron 403 EGRESS_BLOCKED en esta sesión, verificado.
    no_sostiene: >-
      No sostiene NINGUNA cifra de mercado, tamaño, participación ni número de
      entidades — ninguna fue verificada y ninguna se publica. No sostiene
      entrecomillar el texto de ningún artículo ni afirmar qué inciso agregó
      cada reforma posterior, y por eso el cuerpo de la pieza no entrecomilla
      ninguno. No sostiene
      qué hecho detonó cada ley ni quién se opuso a cada tramo: la historia de
      la tramitación vive en bcn.cl y camara.cl, bloqueados. No sostiene
      causalidad entre estas separaciones y el desarrollo del mercado chileno.
      No sostiene que la Ley 20.345 trate de custodia (trata de riesgo de
      contraparte). No sostiene que en fondos privados no exista obligación
      alguna de custodia. No sostiene que el gremio respalde este proyecto de
      ley: su propuesta es de marzo de 2026 y es anterior e independiente.
    nota: >-
      Vía de ascenso declarada: abrir desde una red sin bloqueo el artículo 179
      en leychile.cl con sus notas al pie, el artículo 53 de la Ley 20.712 y la
      norma de carácter general que define los instrumentos no susceptibles de
      custodia, y el Boletín N° 1.170-05 en camara.cl. Con eso este claim sube
