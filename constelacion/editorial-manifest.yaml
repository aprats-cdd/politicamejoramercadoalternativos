# Manifest del motor editorial — lo mantiene AG-SITIO-CURADOR (cola) +
# AG-SITIO-VERIFICADOR (gate). Cada pieza editorial (opinión, hipótesis,
# ensayo) se declara acá para que eval_editorial.py la gatee contra la voz
# de la casa (voz-de-la-casa.md).
#
#   modo: hard     → pieza nueva bajo la spec; un hallazgo es ROJO.
#   modo: advisory → corpus pre-spec; se reporta, no bloquea (LEC-20260703:
#                    el texto vigente no se reescribe por estilo sin rediseño;
#                    sirve de calibración del calibrador).
#
# techo_palabras: opinión ≤ ~1100 · hipótesis ≤ ~1300 · ensayo ≤ ~2600.
#
# Rediseño 12-sep-2026: el corpus fundacional de julio salió del sitio
# (ver sitio-manifest.yaml). Queda una pieza, y entra en modo hard con un
# techo propio: el encargo del CEO fue explícito en que sea corta.
#
# El techo se fijó primero en 1100 y la primera versión calzó. La corrida
# del adversario (runs/AG-SITIO-ADVERSARIO/2026-09-12) devolvió NO-PASA y
# obligó a agregar tres bloques que la pieza no tenía: declaración de
# interés con el beneficio directo del autor, sección "lo que el proyecto
# no hace", y el tratamiento en dos direcciones del artículo 169. Subir el
# techo a 1350 fue la decisión declarada en esa vuelta.
#
# Sube a 1900 el 12-sep-2026 con el mismo criterio. La corrida del defensor
# (AG-DEFENSOR-OBJECION) obligó a plantear la objeción rival COMPLETA —sus
# cinco ejes— antes de responderla, y a responder los tres golpes con la
# resolución citada. Ese bloque ES la pieza: recortarlo para calzar un número
# que este manifest inventó reconstruiría el hombre de paja que el gate D03
# existe para impedir. Sigue bajo el techo por defecto de ensayo (2600).
#
# Sube a 2100 en la misma jornada, tras el veredicto PLANTEADA CON PÉRDIDAS
# del defensor. Obligó a agregar: la segunda frontera del artículo 17 (la
# cláusula "salvo"), el bloque de lo que la respuesta NO responde, y la
# asimetría de vigencia entre lo que se suelta y lo que se aprieta. Las tres
# son concesiones contra el interés del autor; recortarlas para calzar el
# número sería exactamente la pérdida que el defensor cazó.
#
# Sube a 2350 tras el veredicto NO-PASA del adversario (misma jornada, cuatro
# lentes). Sus bloqueantes obligaron a precisar lo que no se podía afirmar del
# artículo 98 vigente y del perímetro del gestor, y sus correcciones a pasar la
# lista del balance a condicional y a atribuir el 169 al Mensaje en vez de
# afirmarlo. Todo eso alarga.
#
# DEUDA DECLARADA, no resuelta: la pieza quedó en ~2.300 palabras (unos once
# minutos). El encargo era un landing para un legislador que lee noventa
# segundos. El bloque objeción+respuesta son 937 palabras y es el corazón; la
# sección de las tres reglas (235) duplica en prosa lo que el comparador ya
# muestra. La tensión largo/audiencia es real y está sin resolver: se decide
# con el CEO, no recortando concesiones.

piezas:
  # 12-sep-2026, tercer encargo del CEO: "hazlo breve, fácil". La pieza se
  # parte en dos. La raíz explica en cuatro minutos; las objeciones viven en
  # su propia página, completas, para quien las quiera. Cada una con su techo:
  # la explicación corta de verdad, el debate con espacio para ser justo.
  # Sube de 900 a 960 el 12-sep-2026, en el cambio de registro a la voz v2.
  # El CEO trajo en sesión las dos frases que le faltaban al argumento:
  # «hoy el gato cuida la carnicería» —la formulación coloquial de que la misma
  # entidad decide, valoriza y se controla— y el contraste con los mercados
  # desarrollados: control por oposición y especialización por función, más
  # eficiencia y más control a la vez. Son ~66 palabras y son el argumento
  # central, no adorno: la primera hace que un lector no experto entienda el
  # problema en una imagen, y la segunda dice qué se gana, que es lo único que
  # la pieza no decía. Se recortó primero la grasa real (la tira de estado pasó
  # de tres tarjetas a una línea, y se apretaron tres párrafos: ~20 palabras),
  # y el resto sube el techo. Sigue muy por debajo del techo por defecto de
  # ensayo (2600) y del tiempo de lectura declarado.
  # Sube de 960 a 995 el 12-sep-2026, al entrar historia.html. La raíz gana un
  # párrafo de ~45 palabras que es el argumento que más le faltaba: que la
  # separación propuesta es el quinto tramo de una serie chilena
  # (intermediación, custodia, compensación, patrimonio del fondo), y que el
  # gremio de administradoras pide ese tramo. Eso desarma de una línea la
  # objeción más cómoda contra la pieza —"esto es copiar a Luxemburgo"— y por
  # eso no es adorno. Se recortó primero grasa real: la segunda mitad del
  # párrafo de la firma global duplicaba lo que el párrafo anterior ya decía
  # (-14 palabras). El resto sube el techo. Sigue muy por debajo del techo por
  # defecto de ensayo (2600).
  - archivo: index.html
    tipo: ensayo
    modo: hard
    techo_palabras: 995
  # Sube de 1100 a 1150 el 12-sep-2026, en el reencuadre a la tesis del
  # domicilio. El CEO pidió dos cosas que agregan objeción, no adorno: que la
  # tesis de Luxemburgo cargue con el ataque obvio —"Luxemburgo es un paraíso
  # fiscal"— y con la salida realista que ya circula en el debate público
  # —"seamos un hub andino, paso a paso"—. Son dos ejes nuevos de la objeción
  # con su respuesta, ~100 palabras. Recortar concesiones para calzar 1100
  # reconstruiría el hombre de paja que D03 existe para impedir, así que se
  # recortó la grasa real (~16 palabras) y el resto sube el techo. Sigue muy
  # por debajo del techo por defecto de ensayo (2600).
  - archivo: objeciones.html
    tipo: ensayo
    modo: hard
    techo_palabras: 1150
  # Nace el 12-sep-2026 con techo 1300, y el techo se fija por el contenido,
  # no al revés. La pieza tiene dos partes que no se pueden comprimir sin
  # romperla: cuatro tramos normativos que hay que describir con su ley, su
  # año y qué quedó a cada lado (si se resume más, deja de ser verificable y
  # pasa a ser una línea de tiempo decorativa), y un bloque de método que es
  # el doble de largo de lo normal porque TODA la evidencia de esta pieza es
  # de oído. La regla 8 de la voz de la casa exige declarar qué se afirma, de
  # dónde viene, que no se leyó el original y qué NO sostiene: eso son siete
  # notas al pie largas, y la sección de fuentes no cuenta para el techo, pero
  # el Método sí. Recortar el Método para calzar un número sería recortar
  # exactamente la parte que hace publicable una pieza citada de oído.
  - archivo: historia.html
    tipo: ensayo
    modo: hard
    techo_palabras: 1300
