# Manifest del sitio — lo mantiene AG-SITIO-VERIFICADOR.
#
# Rediseño 12-sep-2026 (decisión del CEO en sesión): el corpus fundacional
# de julio (seis piezas + memorándum) se retiró del sitio. Razón declarada
# por el dueño: "quedó muy pesada y muy Claude". El sitio queda en un home
# y una pieza, dirigida a un lector nuevo (legislador y prensa), sobre el
# proyecto de ley de reforma al mercado de capitales ingresado el
# 9-sep-2026. Las piezas retiradas viven en el historial de git.
#
# corpus_base queda ANCLADO al commit e7fa0df (último main antes del
# rediseño), no a origin/main. Razón: el memorándum deja de existir en main
# con este merge, y S06 —que mide reutilización de texto contra ese corpus—
# fail-closea si no puede leerlo. Un SHA es permanente; la rama no. El
# corpus sigue siendo el mismo documento contra el cual se midieron todas
# las piezas del sitio desde julio, así que la vara no cambia.
estado: cierre
corpus_base: git:e7fa0df75fdeb33f1039f317ad24010f45f885ed:memorandum.html
umbral_similitud: 0.02
paginas:
- archivo: index.html
  tipo: ensayo        # la raíz ES la pieza desde el rediseño de landing (12-sep-2026)
  nueva: true
  gate_pasado: true   # adversario NO-PASA → 15 fixes aplicados → PASA-CON-FIXES
                      # (run 2026-09-12, AG-SITIO-ADVERSARIO, agente aislado)
- archivo: objeciones.html
  tipo: ensayo
  nueva: true
  responde_objecion: true   # enciende constelacion/eval_steelman.py (D01-D05)
  gate_pasado: true   # adversario + defensor, runs del 12-sep-2026
- archivo: gestor-de-inversiones.html
  tipo: asset         # redirección a la raíz: conserva el link ya publicado
  nueva: false
  gate_pasado: true
- archivo: og-cover.html
  tipo: asset        # 12-sep-2026: reconvertida en redirección a la raíz. Traía la
  nueva: false       # portada del memorándum (cifras retiradas + "sin Congreso"), que
  gate_pasado: true  # contradecía la pieza vigente: es el veto V4 del juez. La URL se
                     # conserva por los compartidos viejos; og-cover.svg quedó como copia
                     # de la tarjeta vigente. No se borró nada.
- archivo: feed.xml
  tipo: asset
  nueva: false
  gate_pasado: true
- archivo: assets/og-sitio.svg   # fuente de la tarjeta social. Desde el 12-sep-2026
  tipo: asset                    # og:image apunta a assets/og-sitio.png, exportado de
  nueva: false                   # este SVG (1200x630): las redes no renderizan SVG. El
  gate_pasado: true              # PNG no se declara acá porque el gate lee en UTF-8.
