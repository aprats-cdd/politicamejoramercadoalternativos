# Tabla del lector — pieza "gestor-de-inversiones.html" (12-sep-2026).
#
# Lector nuevo del sitio tras el rediseño: quien legisla y quien informa.
# El encargo del CEO fue explícito: "explicar a políticos y periodistas las
# ventajas de esta nueva ley". Cada pregunta que ese lector trae a la página
# se responde en la página, o el gap se declara en la página. Sin terceras
# opciones (L03, fail-closed).
#
# Objeto: gestor-de-inversiones.html · anclas verificadas por eval_lector.py
# contra las páginas declaradas en sitio-manifest.yaml.

pieza: index.html
fecha: 2026-09-12

preguntas:

  - pregunta: "¿Qué crea este proyecto que hoy no existe en Chile?"
    lector: legislador
    estado: respondida
    donde: "#figura"
    evidencia: "El proyecto reemplaza el artículo 16 por uno que permite a la administradora encomendar la cartera del fondo, toda o parte, a un gestor de inversiones designado en el reglamento interno."

  - pregunta: "¿Por qué hoy no llegan gestores de activos globales a invertir en Chile?"
    lector: legislador
    estado: respondida
    donde: "#falta"
    evidencia: "Sección «Lo que a Chile le falta»: para una firma global, entrar a Chile hoy significa montar una administradora completa; por eso no entran. Los artículos 15, 16 y 17 hacen que contratar a un especialista cueste y no libere."

  - pregunta: "¿Ese diagnóstico es del autor o del Gobierno?"
    lector: periodista
    estado: respondida
    donde: "#falta"
    evidencia: "El diagnóstico es del propio Mensaje presidencial: «[...] lo que ha impedido en la práctica el surgimiento de un mercado de gestores de inversión especializados [...]»"

  - pregunta: "¿Esto es desregulación? ¿Quedan menos entidades bajo supervisión?"
    lector: legislador
    estado: respondida
    donde: "#respuesta"
    evidencia: "El gestor entra a un registro público y queda bajo fiscalización de la CMF: habrá más entidades supervisadas que hoy."

  - pregunta: "¿Quién responde ante los partícipes si el gestor toma una mala decisión de inversión?"
    lector: legislador
    estado: respondida
    donde: "#figura"
    evidencia: "La responsabilidad por las decisiones del gestor queda en el gestor. La administradora deja de responder por ellas, salvo por sus propios incumplimientos."

  - pregunta: "¿Quién paga al gestor externo: el fondo o la administradora?"
    lector: legislador
    estado: respondida
    donde: "#figura"
    evidencia: "La remuneración del gestor puede pagarla el fondo, si el reglamento interno lo establece de forma expresa."

  - pregunta: "¿Qué pasa con la cartera si el gestor quiebra o pierde su inscripción?"
    lector: legislador
    estado: respondida
    donde: "#respuesta"
    evidencia: "Opera el mecanismo de sustitución del reglamento interno y, a falta de él, la administradora retoma la cartera, con aviso a la CMF y a los partícipes al día hábil siguiente."

  - pregunta: "¿Qué gana con esto una empresa chilena que busca financiamiento?"
    lector: gremio
    estado: respondida
    donde: "#respuesta"
    evidencia: "Hoy la banca concentra el 83% del financiamiento empresarial del país [...] Cada gestor nuevo que mira crédito privado chileno es un oferente más en esa mesa."

  - pregunta: "¿Esto ya es ley? ¿Desde cuándo rige?"
    lector: periodista
    estado: respondida
    donde: "#cuando"
    evidencia: "Tira de estado, sobre el fold: «9 sep 2026 — Ingresó a la Cámara de Diputados» y «No es ley — En tramitación. El texto puede cambiar»."

  - pregunta: "Si se aprueba, ¿cuánto se demora en aplicarse?"
    lector: periodista
    estado: respondida
    donde: "#cuando"
    evidencia: "Tira de estado, sobre el fold: «6 meses — Plazo de la CMF para dictar las normas, desde que la ley se publique»."

  - pregunta: "¿Quién escribe esto y qué gana si el proyecto se aprueba?"
    lector: periodista
    estado: respondida
    donde: "#declaracion"
    evidencia: "Soy socio fundador de un gestor de deuda privada que opera en Chile. Si este proyecto se aprueba, el mercado en el que trabajo se abre a más competidores, varios más grandes que nosotros."

  - pregunta: "¿Puedo verificar las citas por mi cuenta antes de publicarlas?"
    lector: periodista
    estado: respondida
    donde: "#metodo"
    evidencia: "Lo que va entre comillas está transcrito del Mensaje presidencial N° 166-374 y de la minuta del Ministerio de Hacienda, con la página al pie."

  - pregunta: "¿Hay evidencia de que efectivamente vayan a llegar gestores globales, o es una expectativa?"
    lector: periodista
    estado: gap-declarado
    donde: "#respuesta"
    evidencia: "El proyecto habilita la competencia; no la garantiza. Que lleguen gestores globales dependerá de cómo la CMF escriba las normas de detalle y de si el tamaño del mercado chileno justifica el viaje. [...] Puede fallar."

  - pregunta: "¿De qué tamaño sería el mercado de gestores externos en Chile?"
    lector: periodista
    estado: gap-declarado
    donde: "#metodo"
    evidencia: "No publico cifras del tamaño de ese mercado: el proyecto no las trae y no tengo fuente pública."

  - pregunta: "¿Qué otras materias del proyecto quedan fuera de esta página?"
    lector: periodista
    estado: gap-declarado
    donde: "#metodo"
    evidencia: "Esta página cubre una sola materia de las 252 páginas del proyecto: la separación funcional de roles en la industria de fondos."

  - pregunta: "¿Esto profundiza el mercado de capitales chileno o solo reacomoda a los que ya están?"
    lector: banca-desarrollo
    estado: respondida
    donde: "#cadauno"
    evidencia: "Sección «Lo que se abre»: una administradora chica podría ofrecer estrategias que hoy no sabe correr, y un fondo regional que hoy se arma afuera podría armarse acá, con administración, custodia y auditoría chilenas. Marcado como lectura del autor."

  - pregunta: "¿Cómo le explico esto a un afiliado que no sabe qué es una AGF?"
    lector: gremio
    estado: respondida
    donde: "#falta"
    evidencia: "«Un fondo de inversión necesita que alguien haga tres cosas distintas. Alguien tiene que decidir en qué se invierte. Alguien tiene que administrar el vehículo [...] Y alguien tiene que responder cuando algo sale mal.»"

  - pregunta: "¿Qué riesgo corre el que ahorra si esto se aprueba?"
    lector: aportante-final
    estado: gap-declarado
    donde: "#objecion"
    evidencia: "El bloque de la objeción declara los tres puntos que la página no responde: costo del estándar sobre base menor, capacidad de fiscalización de la CMF y comparación de colateral antes y después."
