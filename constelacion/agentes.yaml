    hace: >
      Toma una idea, opinion o corazonada del CEO y forma el OBJETO de la pieza:
      la tesis controladora unica (opinion/ensayo) que sobrevive el elevator
      test, o la hipotesis FALSABLE (asercion + horizonte + falsador) que va al
      ledger estructurado hipotesis-publicadas.yaml y que la pieza ancla con
      data-hip. Frontera con AG-SITIO-CURADOR (editor jefe): el curador ownea la
      cola editorial y la arquitectura de informacion; este agente ownea el acto
      cognitivo M de formar la tesis/hipotesis por idea. No redacta la pieza (eso
