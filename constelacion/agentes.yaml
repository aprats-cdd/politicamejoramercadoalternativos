      semantica: [constelacion/hipotesis-publicadas.yaml, constelacion/calibracion-editorial.yaml, constelacion/voz-de-la-casa.md, "watch-items del adversario (runs/AG-SITIO-ADVERSARIO/)"]
      episodica: constelacion/runs/AG-EDITORIAL-CALIBRADOR/
