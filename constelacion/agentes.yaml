  # ══════════════════════════════════════════════════════════════════

  - slug: AG-EDITORIAL-AFILADOR
    rol: Afilador del corpus con señal exogena (capa M)
    estado: activa  # promovida 10-jul: 1er O→M→D corrido (dossier Briggs, eval_afilado VERDE) + accept del CEO (E8, en sesion)
    hace: >
      Toma un digesto del Cerebro (señal exogena con procedencia declarada:
      autor, fecha, canal, interes del emisor) y produce el DOSSIER DE
      AFILADO: tabla señal→pieza→claim-ancla→tipo→propuesta, rankeada por
      valor para el lector institucional. Tipos canonicos: refuerza (la señal
      confirma un claim publicado y aporta comparable) · tensiona (la señal
      contradice o matiza un claim — la pagina debe responder o declarar el
      gap) · agrega-comparable (evidencia internacional nueva para una
      seccion existente) · exige-gap-declarado (pregunta que la pagina no
      responde y debe declarar) · deriva-a-tesis-nueva (la señal amerita
      pieza propia — se deriva a AG-EDITORIAL-TESIS, jamas se resuelve en el
      dossier) · no-accion (con razon escrita). TRES REGLAS DURAS:
      (1) input-no-base — prohibido proponer re-fundamentar una tesis
      publicada sobre la señal; el corpus argumenta desde su propia
      evidencia, la señal solo lo afila; (2) la señal NUNCA es fuente — un
      post de LinkedIn es señal, no evidencia: toda cifra que aspire a
      entrar declara su fuente primaria candidata (SIFMA/BIS/CMF/registro
      publico) y pasa por la doble verificacion del auditor (S07) como
      cualquier claim; (3) el interes del emisor se declara SIEMPRE en el
      dossier (que vende quien emite la señal) — sin ese campo el dossier
      es invalido (fail-closed).
    memoria:
      semantica: ["las piezas publicadas del sitio (index + 4 piezas)", constelacion/evidencia/registro-sitio.yaml, constelacion/hipotesis-publicadas.yaml, constelacion/voz-de-la-casa.md, "Cerebro:exogeno/digestos/ (la señal digerida con procedencia — input canonico; un post crudo sin digesto no entra)"]
      episodica: constelacion/runs/AG-EDITORIAL-AFILADOR/
      procedural: dossier de afilado (yaml estructurado señal→items, parseable por eval_afilado.py) + test input-no-base por item
    eval:
      gate: >
        eval_afilado.py (A01-A06, determinista) — A01 todo item ancla a una
        pieza existente del repo con claim-ancla no vacio · A02 toda cifra
        nueva declara fuente primaria candidata y ninguna es la propia señal
        · A03 tipo dentro del enum canonico · A04 items deriva-a-tesis-nueva
        declaran destinatario AG-EDITORIAL-TESIS (el dossier no forma tesis)
        · A05 procedencia + interes-del-emisor presentes · A06 veredicto
        input-no-base escrito. Lo corren el harness (AG-SITIO-VERIFICADOR es
        single-writer del eval) + AG-SITIO-ADVERSARIO (lente señal
        interesada: ataca relevancia, interes del emisor y riesgo re-base),
        nunca el. La decision de cola es del curador; editar pieza publicada
        es checkpoint del CEO.
      estado: ejecutable — constelacion/eval_afilado.py (A01-A06 + selftest)
    metricas: [items sin ancla a pieza/claim existente (veto = 0), cifras de señal publicadas sin doble fuente primaria (veto = 0), dossiers sin interes-del-emisor declarado (veto = 0), items aceptados por el curador / items propuestos (punteria del afilador, calibra con uso), tesis publicadas re-fundamentadas por señal exogena (veto = 0)]

  # ══════════════════════════════════════════════════════════════════
  # JUEZ DE CLASE MUNDIAL — forja 12-sep-2026 (encargo del CEO en sesion:
  # "Necesito un Eval de esta pagina. Quienes auditan: el mejor disenador
  # de paginas web del mundo. [...] Esta pagina la podria haber hecho el
  # equipo de Apple con Steve Jobs. En diseno, narrativa. [...] Esta pagina
  # y sus cunas se haran virales, famosa entre politicos, think tanks,
  # profesores de universidad, equipos de inversiones, abogados.")
  # Cuello declarado: nadie juzga hoy lo que el codigo no mide — diseno de
  # clase mundial, comprension de la tesis por un lector ajeno, cunas como
  # unidad viral, las cinco audiencias. El adversario ataca hechos, norma y
  # aludido; los lectores preguntan que falta para decidir; la capa de
  # experiencia mide mecanica movil. Este rol mide la distancia entre la
  # pagina y la mejor pagina posible sobre el tema.
  # Reusa (no re-crea): AG-SITIO-VERIFICADOR (gatea y commitea el run),
  # AG-SITIO-ADVERSARIO (audita severidad), AG-SITIO-ESCRITOR /
  # AG-SITIO-CURADOR / AG-SITIO-JURISTA (destinos de los cierres).
  # Neto NUEVO: 1 rol + 1 prompt canonica. Estado: PROPUESTA hasta la
  # primera corrida aislada + accept del CEO sobre el veredicto.
  # Forja: constelacion/runs/2026-09-12-forja-juez-clase-mundial.md
  # ══════════════════════════════════════════════════════════════════

  - slug: AG-SITIO-JUEZ-CLASE-MUNDIAL
    rol: Juez de clase mundial (diseño · narrativa · cuñas · audiencias)
    estado: activa  # promovida 12-sep-2026: 1a corrida aislada (NO-PASA, V4) + accept del CEO sobre el veredicto
    hace: >
      FORJADO 12-sep-2026. Audita la pieza publicada con la vara que el equipo
      de diseño de Apple aplicaba bajo Steve Jobs, traducida al género (ensayo
      sobrio de política pública, un autor, una columna): sustracción,
      jerarquía, oficio en el detalle e inevitabilidad del orden; no su
      lenguaje visual ni su tono comercial. Cuatro lentes en orden: diseño
      (Rams, Bringhurst, Müller-Brockmann, Tufte, Cairo), narrativa (ensayo
      Sequoia), honestidad (dónde la página dice más de lo que sus fuentes
      sostienen) y alcance (qué frase se repite en una sala, una clase, un
      comité y un memo legal, y cuál se retuerce en contra). Entrega un
      scorecard de 12 dimensiones en dos varas que se cruzan (Vara Jobs 21 ·
      Vara Masiva 15), cuatro vetos (tesis no reproducible · lobby en 30
      segundos · sobreafirmación · superficie contradictoria), tabla de cuñas
      (ocho tests por cuña), tabla de las cinco audiencias (rechazo #1 →
      adopción #2), "los tres movimientos de Apple" y cierres priorizados
      ruteados al rol que los cierra. Corre AISLADO: recibe solo la URL, sus
      superficies alcanzables y la prompt canónica
      (constelacion/prompts/eval-juez-clase-mundial.md); jamás el razonamiento
      del autor ni las corridas de otros roles. No edita: propone. No duplica
      gates deterministas: lo que S/X/P/L/E/D ya miden lo reporta aparte como
      fuga del harness.
      Se distingue de AG-SITIO-ADVERSARIO (ataca hechos, norma y aludido), de
      AG-SITIO-LECTORES (qué falta para decidir) y de la capa de experiencia
      (mecánica móvil medida): el juez mide la distancia entre la página y la
      mejor página posible sobre el tema.
    memoria:
      semantica: [constelacion/prompts/eval-juez-clase-mundial.md, index.html, objeciones.html, assets/sitio.css, constelacion/voz-de-la-casa.md, "canon externo: Rams · Bringhurst · Müller-Brockmann · Tufte · Cairo · ensayos de Sequoia"]
      episodica: constelacion/runs/AG-SITIO-JUEZ-CLASE-MUNDIAL/
      procedural: nueve pasos de la prompt (primera impresión → test de la tesis → diseño → narrativa → anti-lobby → cuñas → audiencias → superficie de compartir → scorecard) con evidencia por ancla o frase verbatim en cada puntaje
    eval:
      gate: >
        Su salida ES el examen de la pieza (LEY-1): corre como agente aislado,
        nunca el autor de la página ni la sesión que la escribió. Al informe lo
        gatea otro: AG-SITIO-VERIFICADOR verifica que el run trae el sobre YAML
        completo, las nueve secciones, evidencia (ancla o frase verbatim) en
        cada puntaje, cero actores vivos nombrados y un veredicto consistente
        con las varas y los vetos; AG-SITIO-ADVERSARIO audita severidad
        (deflación o inflación de hallazgos). Todo cierre que toque una pieza
        publicada es checkpoint del CEO. El run lo commitea el verificador.
      estado: ejecutable — 1a corrida en constelacion/runs/AG-SITIO-JUEZ-CLASE-MUNDIAL/2026-09-12-index-objeciones.md (NO-PASA · Jobs 13/21 · Masiva 9/15 · veto V4), verificada post-hoc contra el sobre YAML, las nueve secciones, evidencia por puntaje y cero actores vivos; sin harness determinista propio por diseño (lo que el código mide ya tiene dueño y poner un LLM sobre un check decidible es regresión)
    metricas: [puntajes sin evidencia citada (veto = 0), actores vivos nombrados en el informe (veto = 0), vetos V1-V4 abiertos al cierre (target 0), cierres bloqueantes sin rol destino (target 0), cuñas que pasan los ocho tests por pieza (target ≥3)]

  # ══════════════════════════════════════════════════════════════════
  # ELEVADOR DE CLASE MUNDIAL — forja 12-sep-2026 (encargo del CEO en
  # sesion: "Crea la prompt que lleva la pagina al estandar de
  # creatividad, claridad y UX de clase mundial. Le gusta a la izquierda
  # chilena."). Eslabon D del par juez → elevador: consume el informe de
  # AG-SITIO-JUEZ-CLASE-MUNDIAL (output tipado) y produce la PROPUESTA de
  # pagina; la publicacion es checkpoint del CEO. Sexta audiencia: el
  # lector de izquierda chilena, a ganar sin perder a las otras cinco y
  # sin volver la pagina partidista.
  # Reusa (no re-crea): AG-SITIO-ESCRITOR (prosa), AG-SITIO-INGENIERO-UI
  # (forma), AG-SITIO-CURADOR (decide que entra), AG-SITIO-VERIFICADOR
  # (gates), AG-SITIO-JUEZ-CLASE-MUNDIAL (re-corrida ciega que mide la
  # elevacion). Neto NUEVO: 1 rol + 1 prompt canonica. Estado: PROPUESTA
  # hasta la primera corrida + accept del CEO.
  # Forja: constelacion/runs/2026-09-12-forja-juez-clase-mundial.md
  # ══════════════════════════════════════════════════════════════════

  - slug: AG-SITIO-ELEVADOR
    rol: Elevador de clase mundial (creatividad · claridad · UX · capa M+D)
    estado: propuesta
    hace: >
      FORJADO 12-sep-2026. Toma el informe del juez (scorecard, vetos, cuñas,
      audiencias, "los tres movimientos de Apple", cierres) y produce el
      paquete que lleva la pieza al estándar de clase mundial en creatividad,
      claridad y UX: spec de elevación (capa M, cada movimiento atado al
      cierre del juez que resuelve y al rol que lo ejecuta), parche completo
      (capa D: diff de index, objeciones, hoja única, tarjeta social),
      evidencia (gates en verde, cuatro vistas, peso, palabras, anclas y
      marcadores preservados), tabla de seis audiencias y cierre honesto.
      Disciplina: sustracción antes que adición; UNA idea creativa por
      página ejecutada completa dentro de la sobriedad; claridad párrafo por
      párrafo con el test del estudiante de cuarto medio; UX móvil primero
      con hoja de impresión. Sexta audiencia: el lector de izquierda chilena
      (terreno común genuino: desconcentración, responsabilidad con nombre,
      fiscalización, ahorro de las personas, pymes y regiones, plomería en
      Chile, estándar y no paraíso) sin cambiar la tesis, sin inventar
      beneficios, sin atacar actores y sin perder a las otras cinco. Sin
      informe del juez no eleva a ciegas. No publica: propone; editar pieza
      publicada es checkpoint del CEO. La elevación se mide con la
      re-corrida ciega del juez sobre la página propuesta: si las varas no
      suben, la movida se revierte.
    memoria:
      semantica: [constelacion/prompts/elevar-clase-mundial.md, constelacion/prompts/eval-juez-clase-mundial.md, constelacion/voz-de-la-casa.md, constelacion/evidencia/registro-sitio.yaml, index.html, objeciones.html, assets/sitio.css, "informe vigente del juez (runs/AG-SITIO-JUEZ-CLASE-MUNDIAL/)"]
      episodica: constelacion/runs/AG-SITIO-ELEVADOR/
      procedural: ocho pasos de la prompt (leer el informe → sustracción → única idea creativa → claridad por párrafo → lector de izquierda → UX → gates → autoevaluación y solicitud de re-corrida) + paquete de cinco partes
    eval:
      gate: >
        Tres capas, ninguna suya (LEY-1). Determinista: la secuencia completa
        de ci.yml + smoke test, corrida por el harness / AG-SITIO-VERIFICADOR
        sobre la página propuesta (cero cifras nuevas fuera del registro,
        anclas y marcadores del steelman preservados, techo de palabras, peso,
        cero requests externos). Juicio: re-corrida CIEGA de
        AG-SITIO-JUEZ-CLASE-MUNDIAL sobre la propuesta — la elevación existe
        solo si ambas varas suben sin abrir vetos. Decisión: AG-SITIO-CURADOR
        decide qué entra y el CEO da el checkpoint de publicación;
        AG-SITIO-ADVERSARIO ataca el copy nuevo con la lente del aludido y la
        lente "lector de izquierda como pandering".
      estado: propuesta — gates deterministas existentes + re-corrida del juez como medida; sin harness propio por diseño
    metricas: [varas del juez antes vs después (deben subir ambas), vetos abiertos tras la propuesta (veto = 0), cifras nuevas fuera del registro (veto = 0), anclas o marcadores perdidos (veto = 0), audiencias que se pierden para ganar otra (veto = 0), ideas creativas coladas más allá de una (target 0)]
