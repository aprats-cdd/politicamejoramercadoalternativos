    memoria:
      semantica: [constelacion/voz-de-la-casa.md, constelacion/hipotesis-publicadas.yaml, "el corpus como exemplars de tesis (las 4 piezas)", criterio del elevator test]
      episodica: constelacion/runs/AG-EDITORIAL-TESIS/
